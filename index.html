<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Het Onderwater Theater</title>

<link rel="icon" type="image/png" href="shell_pink.png">

<style>

body{
margin:0;
background:#FFFDF6;
font-family:Arial,sans-serif;
color:#0047FF;
overflow-x:hidden;
}

/* NAVIGATIE */

.top-nav{
position:absolute;
top:20px;
right:40px;
display:flex;
gap:15px;
z-index:100;
}

.top-nav a{
text-decoration:none;
color:#0047FF;
font-weight:bold;
padding:10px 20px;
border:3px solid #0047FF;
border-radius:40px;
transition:.3s;
}

.top-nav a:hover{
background:#0047FF;
color:white;
}

/* HERO */

.hero{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
position:relative;
text-align:center;
overflow:hidden;
}

/* TITEL HOGER */

.hero-content{
position:relative;
z-index:5;
transform:translateY(-90px);
}

.small-title{
font-size:4rem;
font-weight:700;
line-height:1;
margin-bottom:-10px;
}

h1{
font-size:clamp(5rem,10vw,9rem);
line-height:.9;
margin:0;
font-weight:900;
letter-spacing:-0.05em;
}

.tagline{
margin-top:45px;
font-size:1.1rem;
max-width:720px;
line-height:1.5;
}

/* BILLY */

.bottom-image{
position:absolute;
bottom:-120px;
left:0;
width:100%;
height:55vh;

background-image:url("billy.png");
background-size:contain;
background-position:center bottom;
background-repeat:no-repeat;

z-index:1;
pointer-events:none;
}

/* SPONSOREN */

.sponsors{
padding:120px 40px 100px;
text-align:center;
opacity:0;
transform:translateY(60px);
transition:opacity 1s ease, transform 1s ease;
}

.sponsors.visible{
opacity:1;
transform:translateY(0);
}

.sponsors p{
font-size:1.1rem;
font-weight:bold;
margin-bottom:40px;
}

.sponsor-logos{
display:flex;
justify-content:center;
align-items:center;
gap:40px;
flex-wrap:wrap;
}

.sponsor-logos img{
max-height:70px;
max-width:180px;
object-fit:contain;
}

/* MOBIEL */

@media(max-width:800px){

.top-nav{
position:relative;
right:0;
top:20px;
justify-content:center;
flex-wrap:wrap;
padding:0 20px;
}

.hero-content{
transform:translateY(-60px);
}

h1{
font-size:4rem;
}

.small-title{
font-size:2.5rem;
}

.bottom-image{
height:42vh;
bottom:-80px;
}

}

</style>
</head>

<body>

<div class="top-nav">
<a href="over-ons.html">Over ons</a>
<a href="de-film.html">De film</a>
<a href="educatieprogramma.html">Educatie</a>
<a href="contact.html">Contact</a>
</div>

<section class="hero">

<div class="bottom-image"></div>

<div class="hero-content">

<div class="small-title">het</div>

<h1>
ONDERWATER<br>
THEATER
</h1>

<p class="tagline">
Een korte stop-motion kinderfilm en educatief project dat het label verlegenheid onderzoekt.
</p>

</div>

</section>

<section class="sponsors" id="sponsors">

<p>
Dit project wordt mede mogelijk gemaakt door de volgende fondsen en partners:
</p>

<div class="logo-grid">

<img src="afk.png" alt="AFK">

<img src="rotterdam.png" alt="Rotterdam">

<img src="beautifuldistress.png" alt="Beautiful Distress">

<img src="voordekunst.png" alt="Voordekunst">

<img src="sol.png" alt="SOL">

<img src="hetcultuurfonds.png" alt="Cultuurfonds">

<img src="oba.png" alt="OBA">

<img src="thrive.png" alt="Thrive">

</div>

</section>

<script>

const sponsors = document.querySelector("#sponsors");

const observer = new IntersectionObserver((entries) => {
entries.forEach(entry => {
if(entry.isIntersecting){
entry.target.classList.add("visible");
}
});
}, {
threshold: 0.2
});

observer.observe(sponsors);

</script>

</body>
</html>
