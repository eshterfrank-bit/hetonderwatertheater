<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Het Onderwater Theater</title>

<style>

body{
margin:0;
background:#FFFDF6;
font-family:Arial, sans-serif;
overflow-x:hidden;
}

.container{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:60px 30px;
position:relative;
text-align:center;
}

h1{
font-size:clamp(3rem,9vw,7rem);
line-height:0.9;
color:#0047FF;
margin:0;
text-transform:uppercase;
font-weight:900;
}

.small{
font-size:0.35em;
display:block;
text-transform:lowercase;
}

p{
max-width:650px;
font-size:1.2rem;
line-height:1.5;
color:#0047FF;
margin-top:30px;
z-index:2;
}

.button{
display:inline-block;
margin-top:30px;
padding:14px 30px;
border-radius:40px;
border:3px solid #0047FF;
text-decoration:none;
color:#0047FF;
font-weight:bold;
transition:0.3s;
z-index:2;
}

.button:hover{
background:#0047FF;
color:white;
}

/* achtergrond onderaan */ 

.bottom-image{
position:absolute;
bottom:0;
left:0;
width:100%;
height:35vh;

background-image:url("images/Billy-transparent.png");

background-size:contain;
background-position:center bottom;
background-repeat:no-repeat;

z-index:0;
}

.content{
z-index:2;
}

</style>

</head>

<body>

<div class="container">

<div class="content">

<h1>
<span class="small">het</span>
Onderwater<br>
Theater
</h1>

<p>
Een korte stop-motion kinderfilm en educatief project
dat het label verlegenheid onderzoekt.
</p>

<a class="button" href="mailto:eshterfrank@gmail.coml">
Contact
</a>


</div>

<div class="bottom-image"></div>

</div>

</body>
</html>


<div class="bottom-image"></div>

</div>


<section class="partners">

<h2>
Dit project wordt mede mogelijk gemaakt door de volgende fondsen en partners:
</h2>

<div class="logo-grid">

<img src="images/afk.png" alt="">
<img src="images/rotterdam.png" alt="">
<img src="images/beautifuldistress.png" alt="">
<img src="images/voordekunst.png" alt="">
<img src="images/sol.png" alt="">
<img src="images/hetcultuurfonds.png" alt="">
<img src="images/oba.png" alt="">
<img src="images/thrive.png" alt="">

</div>

</section>

<style>

.partners{
padding:120px 40px;
background:#FFFDF6;
text-align:center;
}

.partners h2{
font-size:1rem;
font-weight:normal;
color:#0047FF;
margin-bottom:50px;
max-width:600px;
margin-left:auto;
margin-right:auto;
line-height:1.6;
}

.logo-grid{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:40px;

max-width:900px;

margin:auto;

align-items:center;

}

.logo-grid img{

width:100%;
max-width:140px;
height:80px;

object-fit:contain;

margin:auto;

}

@media(max-width:700px){

.logo-grid{

grid-template-columns:
repeat(2,1fr);

}

}

</style>

</body>
</html>
