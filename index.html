<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Het Onderwater Theater</title>

<link rel="icon" type="image/png" href="shell_pink.png">

<style>

body{
margin:0;
background:#FFFDF6;
font-family:Arial,sans-serif;
color:#0047FF;
overflow-x:hidden;
}

/* LOGO LINKSBOVEN */

.logo-icon{
position:absolute;
top:20px;
left:30px;

width:75px;
height:75px;

border:3px solid #0047FF;
border-radius:20px;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

z-index:100;
}

.logo-icon img{
width:75%;
height:75%;
object-fit:contain;
}


/* NAVIGATIE */

.top-nav{
position:absolute;
top:20px;
right:40px;
display:flex;
gap:15px;
z-index:100;
}

.top-nav a{
text-decoration:none;
color:#0047FF;
font-weight:bold;
padding:10px 20px;
border:3px solid #0047FF;
border-radius:40px;
transition:.3s;
}

.top-nav a:hover{
background:#0047FF;
color:white;
}


/* HERO */

.hero{

height:100vh;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

position:relative;

text-align:center;

overflow:hidden;
}


/* BILLY ACHTER TITEL */

.bottom-image{

position:absolute;

bottom:-40px;
left:0;

width:100%;
height:45vh;

background-image:url("billy.png");
background-size:contain;
background-position:center bottom;
background-repeat:no-repeat;

z-index:1;

pointer-events:none;

}


/* TITEL */

.hero-title{
position:relative;
z-index:5;
}

.small-title{

font-size:4rem;
font-weight:700;

margin-bottom:-10px;

line-height:1;
}

.hero-title h1{

font-size:clamp(5rem,10vw,9rem);

line-height:.9;

margin:0;

font-weight:900;

letter-spacing:-0.05em;
}

.tagline{

margin-top:50px;

font-size:1.1rem;

max-width:700px;

line-height:1.5;

position:relative;

z-index:5;
}



/* MOBIEL */

@media(max-width:800px){

.logo-icon{

left:20px;
top:20px;

width:60px;
height:60px;
}

.top-nav{

position:relative;

right:0;
top:20px;

justify-content:center;

flex-wrap:wrap;

padding:0 20px;
}

.hero-title h1{

font-size:4rem;
}

.small-title{

font-size:2.5rem;
}

.bottom-image{

height:35vh;
}

}

</style>

</head>

<body>


<!-- LOGO -->

<a href="index.html" class="logo-icon">
<img src="shell_pink.png" alt="logo">
</a>


<!-- MENU -->

<a href="contact.html">Contact</a>

</div>



<section class="hero">


<div class="bottom-image"></div>


<div class="hero-title">

<div class="small-title">
het
</div>

<h1>

THEATER

</div>


<p class="tagline">

</p>

</section>

</body>
</html>
